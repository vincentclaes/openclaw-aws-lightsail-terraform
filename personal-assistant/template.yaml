AWSTemplateFormatVersion: "2010-09-09"
Description: Rescope personal assistant running OpenClaw on a private-by-default AWS Lightsail instance.

Parameters:
  InstanceName:
    Type: String
    Default: rescope-personal-assistant
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,253}[A-Za-z0-9]$"
    Description: Name of the Lightsail instance and static IP.
  KeyPairName:
    Type: String
    MinLength: 1
    Description: Existing Lightsail key pair in the stack Region.
  SshAllowedCidr:
    Type: String
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
    ConstraintDescription: Enter one IPv4 CIDR, normally your current public IP with /32.
    Description: IPv4 CIDR allowed to reach SSH. The OpenClaw gateway is never opened publicly.
  BundleId:
    Type: String
    Default: small_3_0
    Description: Lightsail plan. small_3_0 provides the recommended 2 GB RAM baseline.
  BlueprintId:
    Type: String
    Default: ubuntu_24_04
    Description: Lightsail Ubuntu blueprint.
  OpenClawVersion:
    Type: String
    Default: 2026.7.1-2
    AllowedPattern: "^(latest|[0-9]{4}\\.[0-9]+\\.[0-9]+(?:-[0-9]+)?)$"
    Description: OpenClaw npm version. The default was the latest stable release on 2026-08-19.

Resources:
  OpenClawInstance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: !Ref InstanceName
      AvailabilityZone: !Select [0, !GetAZs ""]
      BlueprintId: !Ref BlueprintId
      BundleId: !Ref BundleId
      KeyPairName: !Ref KeyPairName
      Networking:
        Ports:
          - AccessDirection: inbound
            AccessFrom: Custom
            AccessType: Public
            CommonName: SSH
            FromPort: 22
            ToPort: 22
            Protocol: tcp
            Cidrs:
              - !Ref SshAllowedCidr
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: workload
          Value: rescope-personal-assistant
      UserData:
        Fn::Sub: |
          #!/usr/bin/env bash
          if [ -z "$BASH_VERSION" ]; then exec /usr/bin/env bash "$0" "$@"; fi
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          log() { printf '[openclaw-bootstrap] %s\n' "$1"; }

          log "adding swap"
          if ! swapon --show | grep -q /swapfile; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            printf '/swapfile none swap sw 0 0\n' >> /etc/fstab
          fi

          log "installing base packages"
          apt-get update -y
          apt-get install -y ca-certificates curl git jq openssl build-essential openssh-server unattended-upgrades

          log "hardening SSH"
          cat >/etc/ssh/sshd_config.d/60-openclaw.conf <<'EOF_SSH'
          PasswordAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          AllowTcpForwarding yes
          GatewayPorts no
          X11Forwarding no
          ClientAliveInterval 120
          ClientAliveCountMax 2
          EOF_SSH
          systemctl restart ssh

          log "installing Node.js and OpenClaw"
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          npm install -g "openclaw@${OpenClawVersion}"

          log "creating loopback-only OpenClaw gateway"
          install -d -m 700 -o ubuntu -g ubuntu /home/ubuntu/.openclaw
          if ! grep -q '^OPENCLAW_GATEWAY_TOKEN=' /home/ubuntu/.openclaw/.env 2>/dev/null; then
            printf 'OPENCLAW_GATEWAY_TOKEN=%s\n' "$(openssl rand -hex 32)" > /home/ubuntu/.openclaw/.env
          fi
          chown ubuntu:ubuntu /home/ubuntu/.openclaw/.env
          chmod 600 /home/ubuntu/.openclaw/.env
          loginctl enable-linger ubuntu || true

          sudo -H -u ubuntu bash <<'EOF_OPENCLAW'
          set -euo pipefail
          cd /home/ubuntu
          set -a
          source /home/ubuntu/.openclaw/.env
          set +a
          if [ ! -f /home/ubuntu/.openclaw/openclaw.json ]; then
            openclaw onboard --non-interactive \
              --mode local \
              --flow quickstart \
              --auth-choice skip \
              --gateway-auth token \
              --gateway-token-ref-env OPENCLAW_GATEWAY_TOKEN \
              --gateway-port 18789 \
              --gateway-bind loopback \
              --install-daemon \
              --daemon-runtime node \
              --skip-skills \
              --accept-risk
          fi
          openclaw plugins install @openclaw/slack@2026.7.1
          openclaw gateway restart || true
          EOF_OPENCLAW

          log "bootstrap complete"

  OpenClawStaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: !Sub "${InstanceName}-ip"
      AttachedTo: !Ref OpenClawInstance

Outputs:
  PublicIp:
    Description: Static public IPv4 address used for SSH.
    Value: !GetAtt OpenClawStaticIp.IpAddress
  SshCommand:
    Description: SSH command. Add -i when the key is not in your SSH agent.
    Value: !Sub "ssh ubuntu@${OpenClawStaticIp.IpAddress}"
  DashboardTunnelCommand:
    Description: Tunnel the loopback-only OpenClaw dashboard to localhost.
    Value: !Sub "ssh -N -L 18789:127.0.0.1:18789 ubuntu@${OpenClawStaticIp.IpAddress}"
  DashboardUrl:
    Description: Open after starting the SSH tunnel.
    Value: http://127.0.0.1:18789/
